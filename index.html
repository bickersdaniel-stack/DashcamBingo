<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashcam Bingo</title>
    <script>
        // Apply the saved theme before the page draws, so it doesn't flash the wrong colours
        (function () {
            let saved = null;
            try { saved = localStorage.getItem("dashcamBingo.theme"); } catch (e) {}
            const dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.dataset.theme = dark ? "dark" : "light";
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Light colours */
        :root {
            color-scheme: light;
            --bg: #f1f3f6;
            --header-bg: rgba(255, 255, 255, 0.85);
            --surface: #ffffff;
            --surface-2: #f8fafc;
            --surface-3: #eef1f5;
            --surface-4: #e2e7ee;
            --board-bg: #ffffff;
            --board-shadow: rgba(15, 23, 42, 0.12);
            --cell-bg: #f8fafc;
            --cell-hover: #ffffff;
            --border: rgba(15, 23, 42, 0.10);
            --border-strong: rgba(15, 23, 42, 0.16);
            --heading: #0f172a;
            --text: #0f172a;
            --cell-text: #334155;
            --text-muted: #475569;
            --text-faint: #64748b;
            --accent: #059669;
            --amber: #b45309;
            --shadow: rgba(15, 23, 42, 0.12);
            --chip-bg: rgba(15, 23, 42, 0.05);
            --empty-bg: #f8fafc;
            --scroll-thumb: rgba(15, 23, 42, 0.15);

            /* Picked colour; app.js updates these */
            --stamp: #22c55e;
            --stamp-text: #0b0d10;
            --stamp-glow: rgba(34, 197, 94, 0.45);
            --stamp-ambient: rgba(34, 197, 94, 0.12);
        }
        /* Dark colours */
        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0b0d10;
            --header-bg: rgba(17, 20, 24, 0.8);
            --surface: #111418;
            --surface-2: #171a20;
            --surface-3: #1e2229;
            --surface-4: #2c323c;
            --board-bg: rgba(17, 20, 24, 0.9);
            --board-shadow: rgba(0, 0, 0, 0.5);
            --cell-bg: rgba(23, 26, 32, 0.8);
            --cell-hover: #1e2229;
            --border: rgba(255, 255, 255, 0.10);
            --border-strong: rgba(255, 255, 255, 0.15);
            --heading: #ffffff;
            --text: #f1f5f9;
            --cell-text: #cbd5e1;
            --text-muted: #94a3b8;
            --text-faint: #64748b;
            --accent: #34d399;
            --amber: #fbbf24;
            --shadow: rgba(0, 0, 0, 0.35);
            --chip-bg: rgba(255, 255, 255, 0.05);
            --empty-bg: rgba(11, 13, 16, 0.4);
            --scroll-thumb: rgba(255, 255, 255, 0.12);
        }

        [hidden] {
            display: none !important;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
            background-color: var(--bg);
            color: var(--text);
        }
        button {
            font: inherit;
        }
        button:focus-visible, .custom-colour:focus-within {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        .icon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scroll-thumb);
            border-radius: 9999px;
        }

        /* Top bar */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 40;
            height: 64px;
            padding: 0 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            user-select: none;
        }
        .bar-side {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--surface-2);
            color: var(--cell-text);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
        }
        .pill:hover {
            background-color: var(--surface-3);
            border-color: var(--border-strong);
        }
        .theme-button .icon {
            color: var(--accent);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }
        .edition {
            font-size: 12px;
            color: var(--text-faint);
        }
        .bar-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--heading);
            white-space: nowrap;
            pointer-events: none;
        }
        .picker-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
        }
        .colour-menu {
            position: relative;
        }
        .colour-pill {
            height: 28px;
            padding: 0 14px;
            gap: 8px;
            border-color: var(--border-strong);
            border-radius: 6px;
            background-color: var(--surface-3);
        }
        /* Drop-down with preset, recent and custom colours */
        .colour-popover {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            z-index: 50;
            width: 212px;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid var(--border-strong);
            border-radius: 12px;
            background-color: var(--surface);
            box-shadow: 0 12px 32px var(--shadow);
        }
        .swatch-label {
            margin: 0 0 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text-muted);
        }
        .swatches {
            display: grid;
            grid-template-columns: repeat(5, 28px);
            gap: 8px;
            margin-bottom: 14px;
        }
        .swatch {
            width: 28px;
            height: 28px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            box-shadow: inset 0 0 0 1px var(--border-strong);
            cursor: pointer;
            transition: transform 0.1s;
        }
        .swatch:hover {
            transform: scale(1.1);
        }
        .swatch[aria-pressed="true"] {
            box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--heading);
        }
        .custom-colour {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            border: 1px dashed var(--border-strong);
            border-radius: 8px;
            color: var(--cell-text);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .custom-colour:hover {
            background-color: var(--surface-3);
        }
        .custom-colour input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: 0;
            opacity: 0;
            cursor: pointer;
        }
        .colour-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--stamp);
            box-shadow: 0 0 0 1px var(--border-strong);
        }
        .colour-code {
            font-family: ui-monospace, Consolas, monospace;
            font-size: 11px;
            text-transform: uppercase;
        }

        /* Page layout: board on the left, winning cards on the right (stacked on narrow screens) */
        .layout {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .stage {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
            overflow-x: hidden;
        }
        .ambient-glow {
            position: absolute;
            top: -96px;
            left: 50%;
            transform: translateX(-50%);
            width: 384px;
            height: 384px;
            border-radius: 50%;
            background-color: var(--stamp-ambient);
            filter: blur(64px);
            pointer-events: none;
        }
        .board-wrap {
            position: relative;
            width: 100%;
            max-width: 620px;
            margin: auto;
        }
        .status-row {
            display: flex;
            align-items: center;
            min-height: 20px; /* keeps the board still when the alert appears */
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .bingo-alert {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--amber);
            animation: bounce 1s infinite;
        }

        /* The board (this whole box is what gets screenshotted) */
        #bingoCardContainer {
            container-type: inline-size; /* lets the squares size their text to the board */
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background-color: var(--board-bg);
            box-shadow: 0 25px 50px -12px var(--board-shadow);
        }
        .shot-title {
            display: none;
            padding: 4px 0 12px;
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            color: var(--heading);
        }
        .capturing .shot-title {
            display: block;
        }
        .bingo-card {
            --gap: 10px;
            --pad: 8px;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            /* Square rows, all growing together if a phrase needs more room */
            grid-auto-rows: minmax(calc((100cqi - 4 * var(--gap)) / 5), 1fr);
            gap: var(--gap);
        }
        .bingo-cell {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
            padding: 6px var(--pad);
            border: 1px solid var(--border);
            border-radius: 12px;
            background-color: var(--cell-bg);
            color: var(--cell-text);
            /* Up to 13px, smaller on narrow boards so the longest words still fit on one line */
            font-size: min(13px, calc((20cqi - 0.8 * var(--gap) - 2 * var(--pad) - 2px) / 6.3));
            font-weight: 500;
            letter-spacing: -0.025em;
            line-height: 1.35;
            text-align: center;
            overflow-wrap: anywhere;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s, background-color 0.2s, color 0.2s;
        }
        @media (hover: hover) {
            .bingo-cell:not(.crossed):hover {
                transform: translateY(-2px);
                box-shadow: 0 4px 14px 0 var(--shadow);
                background-color: var(--cell-hover);
                color: var(--heading);
            }
        }
        .bingo-cell.crossed {
            background-color: var(--stamp);
            border-color: rgba(255, 255, 255, 0.2);
            color: var(--stamp-text);
            font-weight: 600;
            box-shadow: 0 0 18px var(--stamp-glow);
        }
        /* Little dot in the corner of marked squares */
        .bingo-cell.crossed:not(.center-cell)::after {
            content: "";
            position: absolute;
            top: 5px;
            right: 5px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--stamp-text);
            opacity: 0.85;
        }
        .center-cell {
            cursor: default;
        }
        .free-word {
            font-size: clamp(11px, 2.7cqi, 16px);
            font-weight: 800;
            letter-spacing: 0.15em;
        }

        /* Buttons under the board */
        .actions {
            margin-top: 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            background-color: var(--surface-3);
            color: var(--cell-text);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            box-shadow: 0 2px 6px var(--shadow);
            transition: background-color 0.15s, color 0.15s, transform 0.1s;
        }
        .btn:hover {
            background-color: var(--surface-4);
            color: var(--heading);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn .icon {
            color: var(--text-muted);
        }
        .btn-quiet {
            padding: 10px 16px;
            border-color: var(--border);
            background-color: var(--surface);
            color: var(--text-muted);
            font-weight: 500;
            box-shadow: none;
        }

        /* Winning cards */
        .sidebar {
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            border-top: 1px solid var(--border);
            background-color: var(--surface);
        }
        .sidebar-head {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-head .icon {
            color: var(--amber);
        }
        .sidebar-head h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--heading);
        }
        .win-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            align-content: start;
            gap: 14px;
            min-height: 160px;
            padding: 16px;
        }
        .empty-state {
            grid-column: 1 / -1;
            height: 176px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 24px;
            box-sizing: border-box;
            border: 1px dashed var(--border);
            border-radius: 12px;
            background-color: var(--empty-bg);
            text-align: center;
        }
        .empty-icon {
            width: 40px;
            height: 40px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: var(--chip-bg);
            color: var(--text-faint);
        }
        .empty-icon .icon {
            width: 20px;
            height: 20px;
            stroke-width: 1.8;
        }
        .empty-title {
            margin: 0;
            font-size: 12px;
            font-weight: 500;
            color: var(--cell-text);
        }
        .empty-hint {
            max-width: 200px;
            margin: 4px 0 0;
            font-size: 11px;
            color: var(--text-faint);
        }
        .win-card {
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background-color: var(--surface-2);
            animation: pop-in 0.25s ease-out;
        }
        .win-head {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .win-num {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
        }
        .win-info {
            flex: 1;
            min-width: 0;
        }
        .win-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }
        .win-time {
            font-size: 10px;
            color: var(--text-faint);
        }
        .win-tag {
            font-family: ui-monospace, Consolas, monospace;
            font-size: 11px;
            font-weight: 500;
            color: var(--accent);
        }
        .win-card img {
            display: block;
            width: 100%;
            margin-top: 12px;
            border-radius: 8px;
            cursor: pointer;
        }
        .sidebar-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px;
            border-top: 1px solid var(--border);
            background-color: var(--surface-2);
            font-size: 11px;
            color: var(--text-muted);
        }
        .sidebar-foot .count {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sidebar-foot .count::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent);
        }
        .link-button {
            padding: 0;
            border: 0;
            background: none;
            color: var(--text-faint);
            font-size: 11px;
            cursor: pointer;
        }
        .link-button:hover {
            color: var(--cell-text);
        }

        /* Wide screens: winning cards become a full-height column on the right */
        @media (min-width: 1024px) {
            body {
                height: 100vh;
                overflow: hidden;
            }
            .layout {
                flex-direction: row;
                min-height: 0;
            }
            .stage {
                overflow-y: auto;
            }
            .sidebar {
                width: 320px;
                border-top: 0;
                border-left: 1px solid var(--border);
            }
            .win-list {
                flex: 1;
                grid-template-columns: 1fr;
                overflow-y: auto;
            }
        }
        @media (min-width: 1280px) {
            .sidebar {
                width: 384px;
            }
        }
        @media (max-width: 767px) {
            .edition {
                display: none;
            }
            .stage {
                padding: 24px 16px;
            }
        }
        /* Phones: tighter bar and board */
        @media (max-width: 639px) {
            .top-bar {
                padding: 0 16px;
            }
            .bar-title {
                font-size: 16px;
            }
            .theme-label, .picker-label {
                display: none;
            }
            .stage {
                padding: 24px 10px;
            }
            #bingoCardContainer {
                padding: 6px;
                border-radius: 14px;
            }
            .bingo-card {
                --gap: 4px;
                --pad: 2px;
            }
            .bingo-cell {
                border-radius: 8px;
            }
            .btn {
                font-size: 12px;
            }
        }
        @media (max-width: 419px) {
            .colour-code {
                display: none;
            }
        }

        @keyframes pulse {
            50% { opacity: 0.4; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8, 0, 1, 1); }
            50% { transform: none; animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
        }
        @keyframes pop-in {
            from { transform: scale(0.92); opacity: 0.6; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="bar-side">
            <button id="themeButton" class="pill theme-button" type="button" title="Switch between System, Light and Dark"></button>
            <span class="edition">AU Edition</span>
        </div>
        <h1 class="bar-title">Dashcam Bingo</h1>
        <div class="bar-side">
            <label for="colourButton" class="picker-label">Colour Picker:</label>
            <div class="colour-menu">
                <button id="colourButton" class="pill colour-pill" type="button" aria-haspopup="true" aria-expanded="false" title="Pick the colour for marked squares">
                    <span class="colour-dot"></span>
                    <span class="colour-code" id="colourCode">#22C55E</span>
                </button>
                <div class="colour-popover" id="colourPopover" hidden>
                    <p class="swatch-label">Colours</p>
                    <div class="swatches" id="presetSwatches"></div>
                    <div id="recentSection" hidden>
                        <p class="swatch-label">Recent</p>
                        <div class="swatches" id="recentSwatches"></div>
                    </div>
                    <label class="custom-colour">
                        <input type="color" id="colorPicker" value="#22c55e">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16m8-8H4"/></svg>
                        Custom colour
                    </label>
                </div>
            </div>
        </div>
    </header>

    <main class="layout">
        <section class="stage">
            <div class="ambient-glow"></div>
            <div class="board-wrap">
                <div class="status-row">
                    <span class="bingo-alert" id="bingoAlert" hidden>🎉 Bingo winner!</span>
                </div>
                <div id="bingoCardContainer">
                    <div class="shot-title">Dashcam Bingo</div>
                    <div class="bingo-card" id="bingoCard"></div>
                </div>
                <div class="actions">
                    <button id="refreshButton" class="btn" type="button">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        Refresh Card
                    </button>
                    <button id="clearButton" class="btn btn-quiet" type="button">Clear Marks</button>
                </div>
            </div>
        </section>

        <aside class="sidebar">
            <div class="sidebar-head">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
                <h2>Your Winning Cards</h2>
            </div>
            <div class="win-list" id="gallery">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
