<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashcam Bingo</title>
    <style>
        /* Colours (dark versions below follow the device's dark mode setting) */
        :root {
            color-scheme: light dark;
            --page-bg: #f0f0f0;
            --text: #000;
            --card-bg: #ffffff;
            --cell-bg: #ffffff;
            --cell-border: #ddd;
            --free-bg: #ffeb3b;
            --panel-bg: #e0e0e0;
            --panel-heading: #333;
            --panel-shadow: rgba(0,0,0,0.2);
            --img-border: #333;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --page-bg: #121212;
                --text: #e8e8e8;
                --card-bg: #121212;
                --cell-bg: #1e1e1e;
                --cell-border: #3a3a3a;
                --free-bg: #d4b800;
                --panel-bg: #1a1a1a;
                --panel-heading: #ddd;
                --panel-shadow: rgba(0,0,0,0.6);
                --img-border: #555;
            }
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--page-bg);
            color: var(--text);
        }
        /* Title Bar */
        .title-bar {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 24px;
            font-weight: bold;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .title-bar label, .title-bar input {
            margin: 0;
            font-size: 16px;
        }
        
        #colorPicker {
            cursor: pointer;
        }
        /* Layout */
        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding-top: 80px; /* To account for the title bar */
        }
        
        .bingo-section {
            flex: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .bingo-title {
            font-size: 2em;
            color: red;
            font-weight: bold;
            display: none;
            margin-bottom: 10px;
        }
        .bingo-card {
            /* 120px squares, shrinking to fit narrow screens */
            --cell: min(120px, calc((100vw - 80px) / 5));
            display: grid;
            grid-template-columns: repeat(5, var(--cell));
            grid-auto-rows: minmax(var(--cell), auto);
            gap: 5px;
        }
        .bingo-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--cell-bg);
            border: 2px solid var(--cell-border);
            /* Text and padding scale with the square: 16px text and 10px/4px padding at full size */
            font-size: max(10px, calc(var(--cell) * 2 / 15));
            font-weight: bold;
            text-align: center;
            padding: calc(var(--cell) / 12) calc(var(--cell) / 30);
            overflow-wrap: anywhere;
            cursor: pointer;
            user-select: none;
        }
        .bingo-cell.crossed {
            background-color: #4caf50;
            color: white;
            text-decoration: line-through;
        }
        .center-cell {
            background-color: var(--free-bg);
            color: black;
            font-weight: bold;
        }
        .button-container {
            margin-top: 15px;
        }
        button {
            margin: 5px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        /* Gallery on the Right */
        .screenshot-container {
            position: fixed;
            right: 0;
            top: 80px; /* Align below the title bar */
            width: 16.67%; /* 1/6th of the screen */
            height: calc(100vh - 80px);
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: -2px 0 5px var(--panel-shadow);
            overflow-y: auto;
            text-align: center;
        }
        .screenshot-container h2 {
            margin-bottom: 10px;
            font-size: 18px;
            color: var(--panel-heading);
        }
        .gallery {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }
        .gallery img {
            width: 100%;
            height: auto;
            cursor: pointer;
            border: 2px solid var(--img-border);
        }
        #bingoCardContainer {
            display: inline-block;

            text-align: center;
            background-color: var(--card-bg);
        }
        
        .title-overlay {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background-color: #333; /* Default background color */
            padding: 10px;
            width: 100%;
            display: none; /* Always visible */
        }
        .color-picker-container {
            display: grid;
            float: right;
            margin-top: 10px;
            text-align: center;
            font-size: 16px;
        }
        .pick{
            position: absolute;
            right: 0;
        }
        /* Narrow screens: put the winning cards under the bingo card instead of on top of it */
        @media (max-width: 1050px) {
            .container {
                flex-direction: column;
            }
            .screenshot-container {
                position: static;
                width: auto;
                height: auto;
                box-shadow: none;
            }
            .gallery {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
        /* Phones: hide the picker's label so it doesn't cover the title */
        @media (max-width: 600px) {
            .title-bar label {
                display: none;
            }
            .bingo-section {
                padding: 20px 8px;
            }
            .bingo-card {
                --cell: calc((100vw - 40px) / 5);
            }
            .bingo-cell {
                hyphens: auto;
            }
        }
    </style>
</head>
<body>  
    <div class="title-bar">
        <div class="pick"> <label for="colorPicker" style="margin-right: 10px; color: white;">Colour Picker:</label>
            <input type="color" id="colorPicker" value="#4caf50" title="Colour Picker"> <!-- Default color is green --></div>
        <span>Dashcam Bingo</span>
    </div>
    
    <div class="container">
        <div class="bingo-section">
            <div class="bingo-title" id="bingoTitle">BINGO!!!</div>
            <div id="bingoCardContainer">
                <div class="title-overlay" id="titleOverlay">Dashcam Bingo</div>
                <div class="bingo-card" id="bingoCard"></div>
            </div>
            <div class="button-container">
                <button onclick="refreshCard()">Refresh Card</button>
            </div>
        </div>
        <div class="screenshot-container" id="screenshotContainer">
            <h2>Your Winning Cards</h2>
            <div class="gallery" id="gallery"></div>
        </div>
    </div>
    
    

    <!-- Load html2canvas from CDN for screenshot functionality -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
