<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards · Dashcam Bingo</title>
    <script>
        // Apply the saved theme before the page draws, so it doesn't flash the wrong colours
        (function () {
            let saved = null;
            try { saved = localStorage.getItem("dashcamBingo.theme"); } catch (e) {}
            const dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.dataset.theme = dark ? "dark" : "light";
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" href="/icons/favicon.ico" sizes="32x32">
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/icons/site.webmanifest">
</head>
<body class="has-nav">
    <header class="top-bar">
        <div class="bar-side">
            <a class="wordmark" href="/"><svg class="logo-mark" aria-hidden="true"><use href="/icons/logo-mark.svg#mark-small"/></svg>Dashcam Bingo</a>
            <nav class="bar-nav" aria-label="Pages">
                <a class="pill" href="/">Lobby</a>
                <a class="pill" href="/leaderboard">Leaderboard</a>
                <a class="pill" href="/cards" aria-current="page">Cards</a>
                <a class="pill" href="/shop">Shop</a>
            </nav>
        </div>
        <div class="bar-side">
            <span class="pill shop-coins my-coins" id="coins"></span>
        </div>
    </header>

    <main class="panel-page">
        <h2>Cards</h2>
        <p class="admin-hint">Every square in the game and the skins you've collected for it. Open one to see its details and pick its skin.</p>
        <p class="email-message error" id="cardsMessage" role="status" hidden></p>

        <div class="card-filters" id="cardFilters">
            <input class="link-input" id="cardSearch" type="search" placeholder="Search cards" autocomplete="off" aria-label="Search cards">
            <select class="quality-select" id="cardPack" aria-label="Pack"><option value="">All packs</option></select>
            <select class="quality-select" id="cardOwned" aria-label="Show">
                <option value="">All cards</option>
                <option value="owned">With skins</option>
                <option value="none">No skins yet</option>
                <option value="worn">Wearing a skin</option>
            </select>
            <select class="quality-select" id="cardRarity" aria-label="Skin rarity">
                <option value="">Any rarity</option>
                <option value="common">Common skins</option>
                <option value="rare">Rare skins</option>
                <option value="epic">Epic skins</option>
                <option value="legendary">Legendary skins</option>
            </select>
            <select class="quality-select" id="cardSort" aria-label="Sort">
                <option value="name">A to Z</option>
                <option value="skins">Most skins</option>
                <option value="spotted">Most spotted</option>
                <option value="rare">Rarest sightings</option>
            </select>
            <span class="admin-count" id="cardCount"></span>
        </div>
        <div class="collection-grid" id="collection"></div>
    </main>

    <!-- One card up close: its details, and every skin, with the ones you own to pick from -->
    <dialog class="panel-dialog card-dialog" id="cardDialog" aria-labelledby="detailName">
        <div class="card-dialog-body">
            <div class="play-card" id="detailCard"></div>
            <div class="card-dialog-side">
                <h2 id="detailName"></h2>
                <p class="admin-hint" id="detailMeta"></p>
                <p class="menu-label" id="skinCount">Skins</p>
                <div class="skin-choices" id="skinChoices"></div>
                <p class="admin-hint" id="skinHint"></p>
                <button class="btn btn-primary card-buy" id="buyButton" type="button" hidden></button>
                <p class="menu-label">Profile</p>
                <button class="btn btn-quiet" id="showcaseButton" type="button" aria-pressed="false"></button>
            </div>
        </div>
        <form class="dialog-close" method="dialog"><button class="btn btn-quiet" type="submit">Close</button></form>
    </dialog>

    <script type="module" src="/cards.js"></script>
    <script type="module" src="/account.js"></script>
</body>
</html>
