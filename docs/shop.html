<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop · Dashcam Bingo</title>
    <script>
        // Apply the saved theme before the page draws, so it doesn't flash the wrong colours
        (function () {
            let saved = null;
            try { saved = localStorage.getItem("dashcamBingo.theme"); } catch (e) {}
            const dark = saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
            document.documentElement.dataset.theme = dark ? "dark" : "light";
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="has-nav">
    <header class="top-bar">
        <div class="bar-side">
            <a class="wordmark" href="/">Dashcam Bingo</a>
            <nav class="bar-nav" aria-label="Pages">
                <a class="pill" href="/">Lobby</a>
                <a class="pill" href="/leaderboard">Leaderboard</a>
                <a class="pill" href="/leaderboard#cards">Cards</a>
                <a class="pill" href="/shop" aria-current="page">Shop</a>
            </nav>
        </div>
        <div class="bar-side">
            <span class="pill shop-coins" id="coins"></span>
        </div>
    </header>

    <main class="panel-page shop-page">
        <h2>Shop</h2>
        <p class="email-message error" id="shopMessage" role="status" hidden></p>

        <div id="rollSection">
            <!-- How close the next guaranteed epic is -->
            <section class="board-panel pity-banner">
                <div class="pity-words">
                    <span class="stat-label">Pity counter</span>
                    <strong class="pity-title">Epic or better, guaranteed</strong>
                    <span class="pity-bar" id="pityBar"></span>
                    <p class="shop-pity" id="pity"></p>
                </div>
                <span class="pity-count" id="pityCount"></span>
            </section>

            <section class="board-panel shop-roll">
                <!-- The card flips over to show what you rolled -->
                <div class="reveal" id="reveal">
                    <div class="reveal-inner" id="revealInner">
                        <div class="reveal-face reveal-back play-card"><span class="reveal-logo">Dashcam<br>Bingo</span></div>
                        <div class="reveal-face reveal-front play-card" id="revealFront"></div>
                    </div>
                </div>
                <div class="shop-side">
                    <h3 class="shop-heading">Skin crate</h3>
                    <p class="admin-hint">Each roll gives a skin for a random card. A card's first skin goes straight on, and only you see your skins. Rolling one you already have gives some coins back.</p>
                    <ul class="shop-odds" id="odds" aria-label="Odds"></ul>
                    <button class="btn btn-primary shop-roll-button" id="rollButton" type="button">Roll</button>
                    <p class="shop-result" id="rollResult" aria-live="polite"></p>
                </div>
            </section>
        </div>

        <section>
            <div class="admin-tools shop-collection-tools">
                <h3 class="shop-heading">Your collection</h3>
                <select class="quality-select" id="collectionFilter" aria-label="Show">
                    <option value="owned">Cards with skins</option>
                    <option value="all">Every card</option>
                    <option value="common">Common skins</option>
                    <option value="rare">Rare skins</option>
                    <option value="epic">Epic skins</option>
                    <option value="legendary">Legendary skins</option>
                </select>
                <span class="admin-count" id="collectionCount"></span>
            </div>
            <div class="collection-grid" id="collection"></div>
        </section>
    </main>

    <script type="module" src="/shop.js"></script>
</body>
</html>
